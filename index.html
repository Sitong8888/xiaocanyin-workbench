<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>爆品与赛道筛选</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>爆品与赛道筛选</h1>
    <p class="sub">小餐饮 / 教育 / 培训 / 健康 / 服务 / 设计 / 医疗 / 金融 · 全行业爆品与赛道筛选工作台</p>
  </header>

  <!-- ① 行业大类 -->
  <section class="card">
    <h2 class="sec-title">① 选择行业大类</h2>
    <div id="catTabs" class="cat-tabs"></div>
  </section>

  <!-- ② 选择区域 -->
  <section class="card">
    <h2 class="sec-title">② 选择区域 <span class="hint">（省 → 市 → 区/县）</span></h2>
    <button id="regionPick" class="btn-pick">选择区域 ▾</button>
    <div id="regionPanel" class="region-panel"></div>
    <div id="regionBanner" class="region-banner empty"></div>
  </section>

  <!-- ③ 分析对象选择 -->
  <section class="card">
    <h2 class="sec-title">③ 选择分析对象（主 vs 对比）</h2>
    <div class="cascader-wrap">
      <div class="cascader-head" data-group="A">
        <span class="badge badge-a">主分析对象 A</span>
        <span class="path-label" id="path-A"></span>
        <button class="btn-pick" data-group="A">选择行业 ▾</button>
      </div>
      <div class="cascader-panel" data-panel="A"></div>

      <div class="cascader-head" data-group="B">
        <span class="badge badge-b">对比分析对象 B</span>
        <span class="path-label" id="path-B"></span>
        <button class="btn-pick" data-group="B">选择行业 ▾</button>
      </div>
      <div class="cascader-panel" data-panel="B"></div>
    </div>
  </section>

  <div id="emptyState" class="empty">请选择分析对象，查看全景看板</div>

  <!-- 看板 -->
  <section id="dashboard" class="dashboard" hidden>
    <div class="card">
      <h2 class="sec-title">④ 核心指标卡（KPI）</h2>
      <div id="kpiWrap" class="kpi-swipe"></div>
    </div>

    <div class="card">
      <h2 class="sec-title">⑤ 双向交叉对比（雷达 / 矩阵）</h2>
      <div class="two-col">
        <div><div class="sub2">能力雷达</div><div id="radarWrap"></div></div>
        <div><div class="sub2">维度矩阵</div><div id="matrixWrap"></div></div>
      </div>
    </div>

    <div class="card">
      <h2 class="sec-title">⑥ 近 12 个月趋势</h2>
      <div id="lineWrap"></div>
    </div>

    <button id="drillBtn" class="drill-btn">🔍 下钻：品牌与商品全景图</button>
  </section>

  <!-- ⑦ 战略空位分析面板 -->
  <section class="card">
    <h2 class="sec-title">⑦ 🎯 战略空位分析面板 <span class="hint">（顾均辉空位表）</span></h2>
    <div id="stratTabs" class="strat-tabs" hidden></div>
    <div id="stratSingle"></div>
    <div id="stratCompare"></div>
  </section>

  <footer class="foot">数据模型含 8 大行业 · 94 个三级细分赛道 · 区域系数实时定制 · Demo 数据仅供演示</footer>

  <!-- 下钻抽屉 -->
  <div id="drawerMask" class="drawer-mask"></div>
  <div id="drawer" class="drawer">
    <div class="drawer-bar"><span>品牌与商品全景图</span><button id="drawerClose" class="drawer-x">✕</button></div>
    <div id="drawerBody" class="drawer-body"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
